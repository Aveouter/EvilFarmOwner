name: Source validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-source:
    name: Repository source checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 8
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x

      - name: Validate repository source
        shell: bash
        run: |
          set -euo pipefail

          bash -n scripts/verify-release.sh scripts/verify-release-asset.sh scripts/verify-core-boundary.sh scripts/collect-multiplayer-evidence.sh
          scripts/verify-core-boundary.sh
          git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD

          jq empty manifest.json i18n/default.json i18n/zh.json
          jq -e '
            .Name == "Evil Farm Owner"
            and .Author == "Aveouter"
            and .UniqueID == "Aveouter.EvilFarmOwner"
            and .EntryDll == "EvilFarmOwner.dll"
            and (.UpdateKeys | index("GitHub:Aveouter/EvilFarmOwner") != null)
          ' manifest.json >/dev/null

          manifest_version="$(jq -er '.Version | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?$"))' manifest.json)"
          project_version="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' EvilFarmOwner.csproj)"
          test "$project_version" = "$manifest_version"
          grep -Fq "Stardew Valley SMAPI Mod · v$manifest_version" README.md
          grep -Fq "## $manifest_version -" CHANGELOG.md

          test -f LICENSE
          grep -Fxq 'MIT License' LICENSE
          grep -Fxq 'Copyright (c) 2026 Aveouter' LICENSE
          grep -Fq '[MIT](LICENSE) © 2026 Aveouter.' README.md

          jq -r 'keys[]' i18n/default.json | LC_ALL=C sort > "$RUNNER_TEMP/efo-default-keys.txt"
          jq -r 'keys[]' i18n/zh.json | LC_ALL=C sort > "$RUNNER_TEMP/efo-zh-keys.txt"
          diff -u "$RUNNER_TEMP/efo-default-keys.txt" "$RUNNER_TEMP/efo-zh-keys.txt"

      - name: Build deterministic core
        run: dotnet build EvilFarmOwner.Core.csproj --configuration Release

      - name: Run deterministic logic tests
        run: dotnet run --project tests/EvilFarmOwner.LogicTests.csproj --configuration Release
